<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi Đỗ Vào 10 - Kho Đề Thi PDF</title>
    <style>
        :root { --primary: #2c3e50; --math: #e74c3c; --lit: #27ae60; --eng: #2980b9; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        
        /* Bảng danh sách đề */
        .file-list { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #eee; padding: 15px; text-align: left; }
        td { padding: 15px; border-top: 1px solid #eee; }
        
        .tag { padding: 5px 10px; border-radius: 5px; color: white; font-size: 12px; font-weight: bold; }
        .btn-download { background: #3498db; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-size: 14px; }
        .btn-download:hover { background: #2980b9; }

        /* Vùng dành cho Admin */
        .admin-note { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <h1>THI ĐỖ VÀO 10 - KHO TỆP ĐỀ THI</h1>
    <p>Tải đề - Làm bài - Xem đáp án phân tích</p>
</header>

<div class="container">
    <div class="admin-note">
        <strong>Dành cho Admin:</strong> Để thêm đề mới, bạn chỉ cần tải file lên GitHub và thêm 1 dòng tên file vào code. Rất nhanh!
    </div>

    <div class="file-list">
        <table>
            <thead>
                <tr>
                    <th>Môn học</th>
                    <th>Tên đề thi</th>
                    <th>Ngày đăng</th>
                    <th>Tải về</th>
                </tr>
            </thead>
            <tbody id="file-table-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Dữ liệu danh sách tệp (Bạn chỉ cần quản lý danh sách này)
    const files = [
        { subject: 'Toán', name: 'Đề thi thử lớp 10 Bắc Giang - Lần 1', date: '05/05/2026', link: 'files/de-toan-1.pdf', color: 'var(--math)' },
        { subject: 'Ngữ Văn', name: '32 Câu trắc nghiệm Văn 10 - Có giải chi tiết', date: '06/05/2026', link: 'files/de-van-32-cau.pdf', color: 'var(--lit)' },
        { subject: 'Tiếng Anh', name: 'Tổng hợp ngữ pháp trọng tâm thi vào 10', date: '08/05/2026', link: 'files/ngu-phap-anh.pdf', color: 'var(--eng)' },
    ];

    const tableBody = document.getElementById('file-table-body');
    files.forEach(file => {
        tableBody.innerHTML += `
            <tr>
                <td><span class="tag" style="background:${file.color}">${file.subject}</span></td>
                <td><strong>${file.name}</strong></td>
                <td>${file.date}</td>
                <td><a href="${file.link}" class="btn-download" target="_blank">Tải PDF</a></td>
            </tr>
        `;
    });
</script>

</body>
</html>
    </div>

    <div id="exam-page" class="exam-page">
        <h2 id="subject-title">Tên môn học</h2>
        
        <div id="questions-container">
            </div>

        <button class="btn" style="background: var(--primary)" onclick="finishExam()">Nộp bài & Xem phân tích</button>
        <button class="btn btn-home" onclick="goHome()">Quay lại trang chủ</button>
    </div>
</div>

<script>
    let timeLeft = 3600; // 60 phút
    let timerInterval;

    const data = {
        math: [
            { q: "Câu 1: Giá trị của √25 là:", a: "5", b: "-5", c: "±5", correct: "a", why: "Căn bậc hai số học của một số không âm luôn là số không âm. 5² = 25." },
            { q: "Câu 2: Hệ thức nào đúng trong tam giác vuông?", a: "h² = b.c", b: "h² = b'.c'", c: "a² = b² - c²", correct: "b", why: "Theo hệ thức lượng: Bình phương đường cao bằng tích hai hình chiếu." }
        ],
        lit: [
            { q: "Câu 1: Nhân vật ông Hai trong truyện ngắn Làng yêu cái gì nhất?", a: "Cái nhà", b: "Làng Chợ Dầu", c: "Cái vườn", correct: "b", why: "Yêu làng thống nhất với yêu nước là chủ đề chính của tác phẩm." }
        ]
    };

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 3600;
        timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerHTML = `Thời gian: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); finishExam(); }
            timeLeft--;
        }, 1000);
    }

    function startExam(name, key) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('exam-page').style.display = 'block';
        document.getElementById('subject-title').innerText = "Đề ôn tập " + name;
        
        let container = document.getElementById('questions-container');
        container.innerHTML = "";
        
        if (!data[key]) {
            container.innerHTML = "<p>Dữ liệu đang được cập nhật...</p>";
            return;
        }

        data[key].forEach((item, index) => {
            container.innerHTML += `
                <div class="question" id="q${index}">
                    <div class="question-title">${item.q}</div>
                    <label><input type="radio" name="ans${index}" value="a"> ${item.a}</label>
                    <label><input type="radio" name="ans${index}" value="b"> ${item.b}</label>
                    <label><input type="radio" name="ans${index}" value="c"> ${item.c}</label>
                    <div class="feedback" id="fb${index}"></div>
                </div>
            `;
        });
        startTimer();
    }

    function finishExam() {
        clearInterval(timerInterval);
        let currentSubject = document.getElementById('subject-title').innerText.includes("Toán") ? "math" : "lit";
        
        data[currentSubject].forEach((item, index) => {
            let selected = document.querySelector(`input[name="ans${index}"]:checked`);
            let fb = document.getElementById(`fb${index}`);
            fb.style.display = "block";
            
            if (selected && selected.value === item.correct) {
                fb.className = "feedback correct-ans";
                fb.innerHTML = `<b>Đúng!</b> ${item.why}`;
            } else {
                fb.className = "feedback wrong-ans";
                fb.innerHTML = `<b>Sai rồi!</b> Đáp án đúng là ${item.correct.toUpperCase()}. <br> <i>Phân tích:</i> ${item.why}`;
            }
        });
        window.scrollTo(0, 0);
    }

    function goHome() {
        document.getElementById('home-page').style.display = 'grid';
        document.getElementById('exam-page').style.display = 'none';
        clearInterval(timerInterval);
        document.getElementById('timer').innerHTML = "Thời gian: 60:00";
    }
</script>

</body>
</html>
